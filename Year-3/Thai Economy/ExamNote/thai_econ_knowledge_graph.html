<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai Economy — Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08090e;
    --surface: #0f1117;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --c-theory:   #8b5cf6;
    --c-crisis:   #10b981;
    --c-monetary: #f59e0b;
    --c-struct:   #ef4444;
    --c-intl:     #3b82f6;
    --c-centre:   #e2e8f0;
  }

  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

  body { font-family: 'Syne', sans-serif; color: var(--text); }

  /* ── canvas ── */
  #graph { width: 100vw; height: 100vh; display: block; }

  /* ── UI overlay ── */
  #ui {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 10;
  }

  /* header */
  #header {
    position: absolute; top: 24px; left: 28px;
    pointer-events: all;
  }
  #header h1 {
    font-size: 18px; font-weight: 800; letter-spacing: -0.02em;
    color: var(--text); line-height: 1.1;
  }
  #header p {
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--muted); margin-top: 4px; letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* legend */
  #legend {
    position: absolute; top: 24px; right: 24px;
    background: rgba(15,17,23,0.88);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    pointer-events: all; backdrop-filter: blur(8px);
    min-width: 150px;
  }
  #legend h3 {
    font-size: 9px; font-family: 'DM Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); margin-bottom: 9px;
  }
  .leg-item {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; cursor: pointer;
    opacity: 1; transition: opacity 0.2s;
  }
  .leg-item:hover { opacity: 0.75; }
  .leg-dot {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
  }
  .leg-label { font-size: 11px; color: var(--text); font-weight: 600; }

  /* search */
  #search-wrap {
    position: absolute; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    pointer-events: all;
    display: flex; gap: 8px; align-items: center;
  }
  #search {
    background: rgba(15,17,23,0.9);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px;
    font-family: 'DM Mono', monospace; font-size: 12px;
    color: var(--text); outline: none; width: 260px;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: rgba(255,255,255,0.2); }
  #search-clear {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
    color: var(--muted); font-size: 12px;
    cursor: pointer; font-family: 'DM Mono', monospace;
    transition: all 0.15s;
  }
  #search-clear:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  /* hint */
  #hint {
    position: absolute; bottom: 28px; right: 24px;
    font-family: 'DM Mono', monospace; font-size: 9px;
    color: var(--muted); text-align: right; line-height: 1.8;
    letter-spacing: 0.04em; text-transform: uppercase;
    pointer-events: none;
  }

  /* node count */
  #stats {
    position: absolute; bottom: 28px; left: 28px;
    font-family: 'DM Mono', monospace; font-size: 10px;
    color: var(--muted); letter-spacing: 0.05em;
    pointer-events: none;
  }

  /* ── tooltip / detail panel ── */
  #panel {
    position: absolute; top: 50%; right: 24px;
    transform: translateY(-50%);
    width: 280px;
    background: rgba(15,17,23,0.94);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 18px;
    pointer-events: all; backdrop-filter: blur(12px);
    display: none;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(calc(-50% + 8px)); } to { opacity:1; transform:translateY(-50%); } }
  #panel-close {
    position: absolute; top: 12px; right: 12px;
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1;
  }
  #panel-close:hover { color: var(--text); }
  #panel-tag {
    font-family: 'DM Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  #panel-title {
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
    line-height: 1.3; color: var(--text);
  }
  #panel-bullets {
    list-style: none; margin-bottom: 12px;
  }
  #panel-bullets li {
    font-size: 11.5px; color: rgba(232,234,240,0.8);
    padding: 4px 0 4px 12px; position: relative;
    line-height: 1.55; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  #panel-bullets li::before {
    content: '›'; position: absolute; left: 0;
    color: var(--muted);
  }
  #panel-thai {
    background: rgba(255,255,255,0.04);
    border-radius: 8px; padding: 10px 12px;
    border-left: 2px solid currentColor;
  }
  #panel-thai-label {
    font-family: 'DM Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 5px; opacity: 0.7;
  }
  #panel-thai-text {
    font-size: 11px; line-height: 1.6;
    color: rgba(232,234,240,0.75);
  }
  #panel-connections {
    margin-top: 10px;
    font-family: 'DM Mono', monospace; font-size: 9px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* SVG node styles */
  .node { cursor: pointer; }
  .node circle { transition: r 0.2s; }
  .node text { pointer-events: none; font-family: 'Syne', sans-serif; }
  .link { stroke-opacity: 0.2; fill: none; }

  /* glow filter on selected */
  .node.selected circle { filter: url(#glow); }
  .node.dimmed { opacity: 0.12; transition: opacity 0.3s; }
  .link.dimmed { opacity: 0.03; transition: opacity 0.3s; }
  .node.highlighted { opacity: 1; }
  .link.highlighted { stroke-opacity: 0.55; }
</style>
</head>
<body>

<svg id="graph">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="zoom-layer">
    <g id="links-layer"></g>
    <g id="nodes-layer"></g>
  </g>
</svg>

<div id="ui">
  <div id="header">
    <h1>Thai Economy<br>Knowledge Graph</h1>
    <p>Econ Development · Final Exam</p>
  </div>

  <div id="legend">
    <h3>Topics</h3>
    <div class="leg-item" data-group="theory">
      <div class="leg-dot" style="background:var(--c-theory)"></div>
      <span class="leg-label">Theories</span>
    </div>
    <div class="leg-item" data-group="crisis">
      <div class="leg-dot" style="background:var(--c-crisis)"></div>
      <span class="leg-label">1997 Crisis</span>
    </div>
    <div class="leg-item" data-group="monetary">
      <div class="leg-dot" style="background:var(--c-monetary)"></div>
      <span class="leg-label">Monetary Policy</span>
    </div>
    <div class="leg-item" data-group="struct">
      <div class="leg-dot" style="background:var(--c-struct)"></div>
      <span class="leg-label">Structural Issues</span>
    </div>
    <div class="leg-item" data-group="intl">
      <div class="leg-dot" style="background:var(--c-intl)"></div>
      <span class="leg-label">International Econ</span>
    </div>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search nodes…" autocomplete="off">
    <button id="search-clear">✕</button>
  </div>

  <div id="stats"></div>

  <div id="hint">
    Drag · Scroll to zoom<br>
    Click node for details<br>
    Double-click to focus
  </div>

  <div id="panel">
    <button id="panel-close">✕</button>
    <div id="panel-tag"></div>
    <div id="panel-title"></div>
    <ul id="panel-bullets"></ul>
    <div id="panel-thai">
      <div id="panel-thai-label">🇹🇭 Thailand Context</div>
      <div id="panel-thai-text"></div>
    </div>
    <div id="panel-connections"></div>
  </div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────────
const COLORS = {
  centre:   '#e2e8f0',

  monetary: '#f59e0b',
  struct:   '#ef4444',
  intl:     '#3b82f6',
};

const nodes = [
  // ── CENTRE ──
  { id:'centre', group:'centre', label:'Thai Economic\nDevelopment', size:28,
    bullets:['Central node connecting all major topics','Covers development theories, financial crisis, monetary policy, structural issues, and international economics'],

    thai:'Explains TH 1980–90s export boom (~8% GDP). Cannot explain urban-rural wage gap or Thailand 4.0 shift.' },
  { id:'t-marx', group:'theory', label:"Marx's\nMaterialism", size:13,
    bullets:['Society in continuous transformation','Feudalism → capitalism → socialism','Ruling class vs oppressed class','Reserve army disciplines wages','Superstructure reflects material base'],
    thai:'Covers TH rural-urban class divisions & military-bureaucratic suppression of labour. But socialism never well-developed; interests may align.' },
  { id:'t-rostow', group:'theory', label:"Rostow's\nStages", size:15,

  { id:'t-vicious', group:'theory', label:'Vicious\nCircle', size:14,
    bullets:['Supply side: low income→low savings→low capital→low productivity','Demand side: low income→small market→no investment'],
    thai:'Most evident in Isan: informal moneylenders, low agri productivity → TH govt broke it via BAAC credit, irrigation, village funds.' },
  { id:'t-balanced', group:'theory', label:'Balanced vs\nUnbalanced Growth', size:14,
    bullets:['Balanced (Nurkse/Rosenstein-Rodan): big push, synchronized investment','Unbalanced (Hirschman): create imbalances, backward & forward linkages'],
    thai:'Eastern Seaboard = big push. Auto sector = Hirschman: Toyota/Honda → 100k+ parts suppliers + logistics = "Detroit of Asia".' },
  { id:'t-oring', group:'theory', label:'O-Ring /\nCoord. Failure', size:14,

  { id:'t-lewis', group:'theory', label:'Lewis-Fei-Ranis\nModel', size:15,

  { id:'t-baran', group:'theory', label:"Baran's\nNeo-Marxism", size:12,
    bullets:['Bourgeoisie too weak for independent accumulation','New Deal coalition breaks under socialist threat','Alliance with landed interests + foreign capital','Productive investment → politically impossible'],

  { id:'t-dependency', group:'theory', label:'Dependency\nTheory', size:13,
    bullets:['Metropole → satellite hierarchy extracts surplus','Integration → underdevelopment (Frank)','Satellites develop most when least dependent'],

  { id:'t-washington', group:'theory', label:'Washington\nConsensus', size:14,

  { id:'c-bibf', group:'crisis', label:'BIBF & Financial\nLiberalisation', size:15,

  { id:'c-fc', group:'crisis', label:'Finance Company\nCollapse', size:13,

  { id:'c-attacks', group:'crisis', label:'Speculative Attacks\non Baht', size:15,

  { id:'i-fdi', group:'intl', label:'FDI Dependency\nRisks', size:14,
    bullets:['FDI brought capital, tech transfer, export capacity (electronics, auto, food)','But: wages rose → production relocating to VN, Cambodia, Indonesia','Limited domestic R&D → cannot retain tech advantage','Knowledge spillover conditional on domestic absorptive capacity'],
    thai:'Dependency trap: rely on FDI → FDI leaves as costs rise → no domestic innovation base. Build absorptive capacity before FDI moves on.' },
  { id:'i-policy', group:'intl', label:'Policy Recommendations\n(Theory Applied)', size:14,
    bullets:['Ricardo: shift toward capital+knowledge-intensive exports','Solow: raise saving rate → expand formal pension + capital markets','Lewis: upgrade agri R&D, irrigation, land titling','Keynesian AD: raise min wage + social protection = domestically-led growth','Endogenous: university-industry R&D, domestic VC, selective FDI'],
    thai:'Goal: move from pure export-led (FDI-dependent) to balanced domestically-led growth with innovation as long-run engine.' },
  { id:'i-democracy', group:'intl', label:'Democratic\nInstability Costs', size:11,
    bullets:['Instability raises risk premium demanded by foreign investors','Disrupts continuity of development planning','Undermines credibility of regulatory commitment','ER policy, trade agreements, investment promotion require institutional continuity'],
    thai:'Consistent with Baran\'s political economy: coalition instability → policy discontinuity → suboptimal long-run economic trajectory.' },
];

// ── LINKS (conceptual connections) ──────────────────────────────────────────
const links = [
  // centre → hubs
  {source:'centre', target:'t-solow'},
  {source:'centre', target:'c-attacks'},
  {source:'centre', target:'m-trilemma'},
  {source:'centre', target:'s-trap'},
  {source:'centre', target:'i-fdi'},

  // theory internal
  {source:'t-classical', target:'t-vicious'},
  {source:'t-classical', target:'t-lewis'},
  {source:'t-classical', target:'t-washington'},
  {source:'t-marx', target:'t-baran'},
  {source:'t-marx', target:'t-dependency'},
  {source:'t-rostow', target:'t-vicious'},
  {source:'t-rostow', target:'t-balanced'},
  {source:'t-vicious', target:'t-balanced'},
  {source:'t-vicious', target:'t-lewis'},
  {source:'t-lewis', target:'t-oring'},
  {source:'t-balanced', target:'t-oring'},
  {source:'t-baran', target:'t-dependency'},
  {source:'t-washington', target:'t-solow'},
  {source:'t-solow', target:'t-oring'},
  {source:'t-dependency', target:'t-washington'},

  // crisis internal
  {source:'c-preboom', target:'c-bibf'},
  {source:'c-bibf', target:'c-fc'},
  {source:'c-bibf', target:'c-attacks'},
  {source:'c-fc', target:'c-npl'},
  {source:'c-attacks', target:'c-npl'},
  {source:'c-npl', target:'c-resolution'},
  {source:'c-external', target:'c-attacks'},
  {source:'c-domestic', target:'c-attacks'},
  {source:'c-domestic', target:'c-fc'},
  {source:'c-npl', target:'c-imf'},
  {source:'c-imf', target:'c-recovery'},
  {source:'c-preboom', target:'c-external'},
  {source:'c-preboom', target:'c-domestic'},

  // monetary internal
  {source:'m-trilemma', target:'m-3pillar'},
  {source:'m-failure', target:'m-3pillar'},
  {source:'m-3pillar', target:'m-macro'},
  {source:'m-3pillar', target:'m-er'},
  {source:'m-macro', target:'m-mix'},
  {source:'m-er', target:'m-mix'},

  // structural internal
  {source:'s-agri', target:'s-diversify'},
  {source:'s-agri', target:'s-labour'},
  {source:'s-agri', target:'s-sps'},
  {source:'s-diversify', target:'s-sps'},
  {source:'s-labour', target:'s-trap'},
  {source:'s-agri', target:'s-trap'},

  // international internal
  {source:'i-trade', target:'i-saving'},
  {source:'i-saving', target:'i-fdi'},
  {source:'i-productivity', target:'i-demand'},
  {source:'i-fdi', target:'i-policy'},
  {source:'i-demand', target:'i-policy'},
  {source:'i-democracy', target:'i-fdi'},
  {source:'i-trade', target:'i-productivity'},
  {source:'i-saving', target:'i-productivity'},

  // cross-topic connections
  {source:'t-washington', target:'c-bibf'},
  {source:'t-washington', target:'c-imf'},
  {source:'t-lewis', target:'s-labour'},
  {source:'t-lewis', target:'s-trap'},
  {source:'t-vicious', target:'s-agri'},
  {source:'t-solow', target:'i-saving'},
  {source:'t-solow', target:'i-policy'},
  {source:'t-dependency', target:'i-fdi'},
  {source:'t-baran', target:'i-democracy'},
  {source:'t-oring', target:'s-trap'},
  {source:'t-balanced', target:'s-agri'},
  {source:'m-trilemma', target:'c-domestic'},
  {source:'m-trilemma', target:'c-bibf'},
  {source:'m-failure', target:'c-recovery'},
  {source:'m-er', target:'i-trade'},
  {source:'m-macro', target:'c-resolution'},
  {source:'c-recovery', target:'i-trade'},
  {source:'c-bibf', target:'i-saving'},
  {source:'s-trap', target:'i-productivity'},
  {source:'s-labour', target:'i-productivity'},
  {source:'t-rostow', target:'s-agri'},
  {source:'t-classical', target:'i-trade'},
];

// ── RENDER ──────────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;

const svg = d3.select('#graph')
  .attr('width', W).attr('height', H);

const zoomLayer = d3.select('#zoom-layer');

// zoom
const zoom = d3.zoom()
  .scaleExtent([0.25, 3.5])
  .on('zoom', e => zoomLayer.attr('transform', e.transform));
svg.call(zoom);
svg.call(zoom.translateTo, W/2, H/2);

// colour helper
function col(group) { return COLORS[group] || '#888'; }

// force simulation
const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
    if (d.source.group === 'centre' || d.target.group === 'centre') return 180;
    if (d.source.group !== d.target.group) return 160;
    return 100;
  }).strength(0.4))
  .force('charge', d3.forceManyBody().strength(d => d.group==='centre' ? -800 : -280))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide().radius(d => d.size + 22))
  .force('x', d3.forceX(W/2).strength(0.03))
  .force('y', d3.forceY(H/2).strength(0.03));

// links
const linkSel = d3.select('#links-layer')
  .selectAll('line')
  .data(links).join('line')
  .attr('class', 'link')
  .attr('stroke', d => {
    const sg = typeof d.source === 'object' ? d.source.group : d.source;
    const tg = typeof d.target === 'object' ? d.target.group : d.target;
    if (sg === tg) return col(sg);
    return '#444';
  })
  .attr('stroke-width', d => {
    const sg = typeof d.source === 'object' ? d.source.group : d.source;
    const tg = typeof d.target === 'object' ? d.target.group : d.target;
    return sg === tg ? 1.2 : 0.7;
  });

// nodes
const nodeSel = d3.select('#nodes-layer')
  .selectAll('g')
  .data(nodes).join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag',  (e, d) => { d.fx=e.x; d.fy=e.y; })
    .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
  )
  .on('click', onNodeClick)
  .on('dblclick', onNodeDblClick);

// background glow circle
nodeSel.append('circle')
  .attr('r', d => d.size + 8)
  .attr('fill', d => col(d.group))
  .attr('opacity', 0.06)
  .attr('filter', 'url(#glow-soft)');

// main circle
nodeSel.append('circle')
  .attr('r', d => d.size)
  .attr('fill', d => {
    if (d.group === 'centre') return '#1e1b4b';
    return col(d.group) + '22';
  })
  .attr('stroke', d => col(d.group))
  .attr('stroke-width', d => d.group === 'centre' ? 1.8 : 1.0)
  .attr('stroke-opacity', 0.9);

// label lines (split on \n)
nodeSel.each(function(d) {
  const g = d3.select(this);
  const lines = d.label.split('\n');
  const lineH = d.group === 'centre' ? 13 : 10;
  const offset = -(lines.length - 1) * lineH / 2;
  lines.forEach((line, i) => {
    g.append('text')
      .attr('y', offset + i * lineH)
      .attr('text-anchor', 'middle')
      .attr('dominant-baseline', 'central')
      .attr('font-size', d.group === 'centre' ? '10px' : '8px')
      .attr('font-weight', d.group === 'centre' ? '700' : '600')
      .attr('fill', d.group === 'centre' ? '#c7c2ff' : col(d.group))
      .attr('opacity', 0.95)
      .text(line);
  });
});

// simulation tick
sim.on('tick', () => {
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
});

// stats
document.getElementById('stats').textContent =
  `${nodes.length} nodes · ${links.length} connections`;

// ── INTERACTION ─────────────────────────────────────────────────────────────
let selectedId = null;

function onNodeClick(e, d) {
  e.stopPropagation();
  selectedId = d.id;
  showPanel(d);
  highlightConnected(d.id);
}

function onNodeDblClick(e, d) {
  e.stopPropagation();
  const t = d3.zoomIdentity.translate(W/2 - d.x, H/2 - d.y).scale(1.4);
  svg.transition().duration(500).call(zoom.transform, t);
}

svg.on('click', () => {
  closePanel();
  clearHighlight();
  selectedId = null;
});

function highlightConnected(id) {
  const connected = new Set([id]);
  links.forEach(l => {
    if (l.source.id === id) connected.add(l.target.id);
    if (l.target.id === id) connected.add(l.source.id);
  });
  nodeSel.classed('dimmed', d => !connected.has(d.id));
  nodeSel.classed('highlighted', d => connected.has(d.id));
  linkSel.classed('dimmed', d => !(d.source.id === id || d.target.id === id));
  linkSel.classed('highlighted', d => d.source.id === id || d.target.id === id);
}

function clearHighlight() {
  nodeSel.classed('dimmed', false).classed('highlighted', false);
  linkSel.classed('dimmed', false).classed('highlighted', false);
}

function showPanel(d) {
  const panel = document.getElementById('panel');
  const c = col(d.group);
  document.getElementById('panel-tag').style.color = c;
  document.getElementById('panel-tag').textContent =
    ({theory:'DEVELOPMENT THEORY', crisis:'1997 CRISIS', monetary:'MONETARY POLICY',
      struct:'STRUCTURAL ISSUE', intl:'INTERNATIONAL ECON', centre:'CENTRAL CONCEPT'})[d.group] || d.group.toUpperCase();
  document.getElementById('panel-title').textContent = d.label.replace('\n', ' ');
  const ul = document.getElementById('panel-bullets');
  ul.innerHTML = d.bullets.map(b => `<li>${b}</li>`).join('');
  document.getElementById('panel-thai').style.color = c;
  document.getElementById('panel-thai-label').style.color = c;
  document.getElementById('panel-thai-text').textContent = d.thai || '';
  const connCount = links.filter(l => l.source.id === d.id || l.target.id === d.id).length;
  document.getElementById('panel-connections').textContent = `${connCount} connection${connCount!==1?'s':''}`;
  panel.style.display = 'block';
}

function closePanel() {
  document.getElementById('panel').style.display = 'none';
}

document.getElementById('panel-close').addEventListener('click', e => {
  e.stopPropagation();
  closePanel();
  clearHighlight();
  selectedId = null;
});

// ── SEARCH ───────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { clearHighlight(); return; }
  const matched = new Set(nodes.filter(n => n.label.toLowerCase().includes(q) ||
    n.bullets.some(b => b.toLowerCase().includes(q)) ||
    (n.thai && n.thai.toLowerCase().includes(q))).map(n => n.id));
  nodeSel.classed('dimmed', d => !matched.has(d.id));
  nodeSel.classed('highlighted', d => matched.has(d.id));
  linkSel.classed('dimmed', true).classed('highlighted', false);
  // auto-focus first match
  const first = nodes.find(n => matched.has(n.id));
  if (first && first.x) {
    const t = d3.zoomIdentity.translate(W/2 - first.x, H/2 - first.y).scale(1.2);
    svg.transition().duration(600).call(zoom.transform, t);
  }
});

document.getElementById('search-clear').addEventListener('click', () => {
  document.getElementById('search').value = '';
  clearHighlight();
});

// ── LEGEND FILTER ────────────────────────────────────────────────────────────
document.querySelectorAll('.leg-item').forEach(item => {
  item.addEventListener('click', function() {
    const g = this.dataset.group;
    const matched = new Set(nodes.filter(n => n.group === g || n.group === 'centre').map(n => n.id));
    nodeSel.classed('dimmed', d => !matched.has(d.id));
    linkSel.classed('dimmed', d => !(matched.has(d.source.id) && matched.has(d.target.id)));
    setTimeout(() => { clearHighlight(); }, 2500);
  });
});
</script>
</body>
</html>
